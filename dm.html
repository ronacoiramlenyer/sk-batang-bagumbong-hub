<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Message a Resident – SK Batang Bagumbong Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="app-container dashboard">

    <div class="dashboard-header">
      <h1>Message a Resident</h1>
      <p class="dashboard-subtext">
        Private, direct to another resident — the SK office can't see these.
      </p>
    </div>

    <label>Find someone by name</label>
    <input id="dmSearchInput" type="text" placeholder="Type a name…" autocomplete="off">
    <div id="dmSearchResults" class="convo-list"></div>

    <h2 class="section-title" style="margin-top:20px;">Conversations</h2>
    <div id="dmThreadsList" class="convo-list">
      <p class="dashboard-subtext">No conversations yet.</p>
    </div>

    <span class="back-link" onclick="window.location.href='dashboard.html'">← Back to Dashboard</span>

    <!-- CHAT MODAL -->
    <div id="dmChatModal" class="modal hidden">
      <div class="modal-content registrants-content">
        <h3 id="dmChatWithName">Conversation</h3>

        <div id="dmChatThread" class="chat-thread">
          <p class="dashboard-subtext">Loading…</p>
        </div>

        <form id="dmChatSendForm" class="chat-send-form">
          <input id="dmChatMessageInput" type="text" placeholder="Type a message…" required autocomplete="off">
          <button type="submit" class="submit-btn">Send</button>
        </form>

        <span id="closeDmChatModal" class="back-link">Close</span>
      </div>
    </div>

  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

  <!-- App Logic -->
  <script src="app.js"></script>

</body>
</html>
