<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SK Batang Bagumbong Hub – Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="app-container dashboard">

    <!-- HEADER -->
    <div id="dashboardBanner" class="dashboard-header dashboard-banner">
      <div class="header-icon-row">
        <button id="messagesHeaderBtn" type="button" class="header-icon-btn">
          💬
          <span id="messagesHeaderBadge" class="header-icon-badge hidden"></span>
        </button>
        <button id="profileHeaderBtn" type="button" class="header-icon-btn">
          👤
        </button>
      </div>

      <button id="changeBannerBtn" type="button" class="banner-edit-btn" title="Change cover photo">
        📷
      </button>
      <input id="bannerFileInput" type="file" accept="image/png, image/jpeg" class="hidden">

      <h1 class="banner-title">SK Batang Bagumbong</h1>
    </div>

    <!-- WHAT'S ON YOUR MIND -->
    <div class="dashboard-section">
      <div id="statusWidget" class="status-row">
        <span class="dashboard-subtext">Loading…</span>
      </div>
    </div>

    <!-- ANNOUNCEMENTS -->
    <div class="dashboard-section">
      <h2 class="section-title">Announcements</h2>

      <div id="announcementList" class="announcement-list">
        <p class="dashboard-subtext">No announcements yet.</p>
      </div>
    </div>

    <!-- EVENTS -->
    <div class="dashboard-section">
          <h2 class="section-title">Upcoming Events</h2>

          <div id="userEventList" class="event-list">
      <p class="dashboard-subtext">No upcoming events.</p>
    </div>

    </div>

    <!-- BACK TO ADMIN BUTTON, if in preview mode-->
    <button id="backToAdminBtn"
      type="button"
      class="submit-btn"
      style="display:none; margin-bottom:12px;">
      ← Back to Admin Panel
    </button>

    <!-- LOGOUT -->
    <button id="logoutBtn" type="button" class="submit-btn">
      Logout
    </button>

  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

  <!-- App Logic -->
  <script src="app.js"></script>

</body>
</html>
