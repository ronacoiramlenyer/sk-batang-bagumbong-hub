<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SK Batang Bagumbong Hub – Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="app-container dashboard">

    <!-- HEADER -->
    <div class="dashboard-header">
      <div class="avatar">
        <div class="avatar-circle">
          <span id="avatarInitials">?</span>
        </div>
      </div>

      <h1 id="welcomeName">Welcome!</h1>
      <p class="dashboard-subtext">
        Here’s what’s happening in the community
      </p>
    </div>

    <!-- EVENTS -->
    <div class="dashboard-section">
          <h2 class="section-title">Upcoming Events</h2>

          <div id="userEventList" class="event-list">
      <p class="dashboard-subtext">No upcoming events.</p>
    </div>

    </div>

    <!-- MESSAGES -->
    <div class="dashboard-section">
      <h2 class="section-title">Messages</h2>

      <div id="userMessagesStatus" class="event-list">
        <button type="button" class="action-card small" onclick="window.location.href='messages.html'">
          Open Messages
        </button>
      </div>
    </div>

    <!-- SK BARANGAY ID -->
    <div class="dashboard-section">
      <h2 class="section-title">SK Barangay ID</h2>

      <div id="idApplicationStatus" class="event-list">
        <p class="dashboard-subtext">Loading…</p>
      </div>
    </div>

    <!-- CERTIFICATES -->
    <div class="dashboard-section">
      <h2 class="section-title">My Certificates</h2>

      <div id="myCertificatesList" class="event-list">
        <p class="dashboard-subtext">No certificates yet.</p>
      </div>
    </div>

    <!-- ANNOUNCEMENTS -->
    <div class="dashboard-section">
      <h2 class="section-title">Announcements</h2>

      <div id="announcementList" class="announcement-list">
        <p class="dashboard-subtext">No announcements yet.</p>
      </div>
    </div>

    <!-- BACK TO ADMIN BUTTON, if in preview mode-->
    <button id="backToAdminBtn"
      type="button"
      class="submit-btn"
      style="display:none; margin-bottom:12px;">
      ← Back to Admin Panel
    </button>

    <!-- LOGOUT -->
    <button id="logoutBtn" type="button" class="submit-btn">
      Logout
    </button>

  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

  <!-- App Logic -->
  <script src="app.js"></script>

</body>
</html>
