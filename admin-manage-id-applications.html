<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin – SK ID Applications</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="app-container admin-events">

    <section class="admin-section">
      <div class="section-header">
        <h2>SK Barangay ID Approvals</h2>
      </div>

      <p class="dashboard-subtext">
        Applicant details are collected at signup — review and approve below.
      </p>

      <div class="admin-tabs">
        <button type="button" class="admin-tab-btn active" data-tab="pending">
          Pending <span id="idTabPendingCount" class="admin-tab-count"></span>
        </button>
        <button type="button" class="admin-tab-btn" data-tab="approved">
          Approved <span id="idTabApprovedCount" class="admin-tab-count"></span>
        </button>
      </div>

      <div id="idApplicationsList" class="event-list">
        <p class="dashboard-subtext">No applications yet.</p>
      </div>
    </section>

    <!-- REJECT APPLICANT MODAL -->
    <div id="rejectIdModal" class="modal hidden">
      <div class="modal-content">
        <h3>Reject <span id="rejectIdName"></span>'s ID application</h3>
        <p class="dashboard-subtext">
          Sends them a message explaining why, from the SK office. They can
          reply and resubmit a corrected photo/ID from their Profile page.
        </p>

        <label>Reason (sent to them as a message)</label>
        <textarea id="rejectIdReason" rows="4"></textarea>

        <button id="confirmRejectIdBtn" class="submit-btn">
          Reject & Send Message
        </button>

        <span id="cancelRejectIdBtn" class="back-link">
          Cancel
        </span>
      </div>
    </div>

    <!-- NAVIGATION -->
    <div class="admin-nav">
      <button type="button" class="action-card secondary"
        onclick="window.location.href='admin.html'">
        ← Back to Admin Panel
      </button>
    </div>

    <!-- LOGOUT -->
    <button id="logoutBtn" class="submit-btn logout">
      Logout
    </button>

  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

  <!-- App Logic -->
  <script src="app.js"></script>

</body>
</html>
