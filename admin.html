<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SK Batang Bagumbong Hub – Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="app-container admin-dashboard">

    <!-- HEADER -->
    <div class="dashboard-header">
      <h1>Admin Panel</h1>
      <p class="dashboard-subtext">
        Manage events, announcements, and user experience
      </p>
    </div>

    <!-- OVERVIEW -->
    <div class="dashboard-section">
      <h2 class="section-title">Overview</h2>

      <div class="stat-grid">
        <div class="stat-card">
          <span id="statUpcomingEvents" class="stat-number">–</span>
          <span class="stat-label">Upcoming Events</span>
        </div>
        <div class="stat-card">
          <span id="statTotalRegistrations" class="stat-number">–</span>
          <span class="stat-label">Registrations</span>
        </div>
        <div class="stat-card">
          <span id="statTotalAttended" class="stat-number">–</span>
          <span class="stat-label">Attended</span>
        </div>
        <div class="stat-card">
          <span id="statPendingApplicants" class="stat-number">–</span>
          <span class="stat-label">Pending IDs</span>
        </div>
        <div class="stat-card">
          <span id="statApprovedApplicants" class="stat-number">–</span>
          <span class="stat-label">Approved IDs</span>
        </div>
        <div class="stat-card">
          <span id="statUnreadMessages" class="stat-number">–</span>
          <span class="stat-label">Unread Messages</span>
        </div>
      </div>
    </div>

    <!-- ACTIONS -->
    <div class="admin-actions-grid">

      <!-- EVENTS -->
      <div class="admin-card">
        <h2>📅 Events</h2>

        <div class="admin-card-actions">
          <button type="button" class="action-card"
            onclick="window.location.href='admin-add-events.html'">
            Add
          </button>

          <button type="button" class="action-card secondary"
            onclick="window.location.href='admin-manage-events.html'">
            Manage
          </button>
        </div>
      </div>

      <!-- ANNOUNCEMENTS -->
      <div class="admin-card">
        <h2>📢 Announcements</h2>

        <div class="admin-card-actions">
          <button type="button" class="action-card"
            onclick="window.location.href='admin-add-announcement.html'">
            Add
          </button>
          <button type="button" class="action-card secondary"
            onclick="window.location.href='admin-manage-announcements.html'">
            Manage
          </button>
        </div>
      </div>

      <!-- MESSAGES -->
      <div class="admin-card">
        <h2>💬 Messages <span id="adminUnreadBadge" class="status-badge status-ongoing hidden"></span></h2>

        <div class="admin-card-actions">
          <button type="button" class="action-card"
            onclick="window.location.href='admin-messages.html'">
            Open Inbox
          </button>
        </div>
      </div>

      <!-- USERS -->
      <div class="admin-card">
        <h2>👥 Users <span id="adminAddressRequestBadge" class="status-badge status-ongoing hidden"></span></h2>

        <div class="admin-card-actions">
          <button type="button" class="action-card"
            onclick="window.location.href='admin-manage-users.html'">
            Directory
          </button>
        </div>
      </div>

      <!-- SK BARANGAY ID -->
      <div class="admin-card">
        <h2>🪪 SK ID</h2>

        <div class="admin-card-actions">
          <button type="button" class="action-card"
            onclick="window.location.href='admin-manage-id-applications.html'">
            Applicants
          </button>
          <button type="button" class="action-card secondary"
            onclick="window.location.href='admin-id-template.html'">
            Template
          </button>
        </div>
      </div>

      <!-- CERTIFICATES -->
      <div class="admin-card">
        <h2>🎓 Certificates</h2>

        <div class="admin-card-actions">
          <button type="button" class="action-card"
            onclick="window.location.href='admin-certificate-template.html'">
            Template
          </button>
        </div>
      </div>

      <!-- USER VIEW -->
      <div class="admin-card">
        <h2>👁️ User View</h2>

        <div class="admin-card-actions">
          <button type="button" class="action-card"
            onclick="window.location.href='dashboard.html?preview=admin'">
            Preview
          </button>
        </div>
      </div>

    </div>

    <!-- LOGOUT -->
    <button id="logoutBtn" type="button" class="submit-btn">
      Logout
    </button>

  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

  <!-- App Logic -->
  <script src="app.js"></script>

</body>
</html>
