<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin – Events</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="app-container admin-events">



    <!-- CREATE EVENT -->
    <section class="admin-section create-event">
      <h2>Create New Event</h2>

      <form id="createEventForm" class="admin-form">

        <label>Event Title</label>
        <input type="text" id="eventTitle" placeholder="Youth Leadership Summit" required>

        <label>Description</label>
        <textarea id="eventDescription"
        placeholder="Describe the event details, objectives, and important notes"
        rows="4"></textarea>

        <label>Date</label>
        <input type="date" id="eventDate" required>

        <label>Time</label>
        <input type="time" id="eventTime" required>

        <label>Location</label>
        <input type="text" id="eventLocation" placeholder="Barangay Hall / Covered Court" required>

        <label>Max Participants (optional)</label>
        <input type="number" id="eventCapacity" min="1" step="1" placeholder="Leave blank for no limit">

        <div class="form-actions">
          <button type="submit" class="submit-btn">
            Create Event
          </button>

          <button type="button"
            class="submit-btn secondary"
            onclick="window.location.href='admin.html'">
            Cancel
          </button>
        </div>


      </form>
    </section>


    <!-- LOGOUT -->
    <button id="logoutBtn" class="submit-btn logout">
      Logout
    </button>

  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

  <!-- App Logic -->
  <script src="app.js"></script>

</body>
</html>
