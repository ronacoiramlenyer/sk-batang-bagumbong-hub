<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin – Messages</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="app-container admin-events">

    <section class="admin-section">
      <div class="section-header">
        <h2>Messages</h2>
      </div>

      <div id="conversationsList" class="convo-list">
        <p class="dashboard-subtext">No conversations yet.</p>
      </div>
    </section>

    <!-- CHAT THREAD MODAL -->
    <div id="chatThreadModal" class="modal hidden">
      <div class="modal-content registrants-content">
        <h3 id="chatThreadUserName">Conversation</h3>

        <div id="adminChatThread" class="chat-thread">
          <p class="dashboard-subtext">Loading…</p>
        </div>

        <form id="adminChatSendForm" class="chat-send-form">
          <input id="adminChatMessageInput" type="text" placeholder="Type a message…" required autocomplete="off">
          <button type="submit" class="submit-btn">Send</button>
        </form>

        <button id="deleteConversationBtn" type="button" class="submit-btn secondary" style="margin-top:10px;">
          🗑️ Delete Conversation
        </button>

        <span id="closeChatThreadModal" class="back-link">Close</span>
      </div>
    </div>

    <!-- DELETE CONVERSATION MODAL -->
    <div id="deleteConversationModal" class="modal hidden">
      <div class="modal-content">
        <h3>Delete Conversation</h3>
        <p>
          This will permanently remove this entire conversation, including
          every message in it.<br>
          This cannot be undone.
        </p>

        <button id="confirmDeleteConversationBtn" class="submit-btn">
          Delete Conversation
        </button>

        <span id="cancelDeleteConversationBtn" class="back-link">
          Cancel
        </span>
      </div>
    </div>

    <!-- NAVIGATION -->
    <div class="admin-nav">
      <button type="button" class="action-card secondary"
        onclick="window.location.href='admin.html'">
        ← Back to Admin Panel
      </button>
    </div>

    <!-- LOGOUT -->
    <button id="logoutBtn" class="submit-btn logout">
      Logout
    </button>

  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

  <!-- App Logic -->
  <script src="app.js"></script>

</body>
</html>
