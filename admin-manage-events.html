<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin – Events</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="app-container admin-events">
    

    <!-- EVENTS LIST -->
    <section class="admin-section">

      <div class="section-header">
        <h2>Existing Events</h2>
      </div>

      <div id="adminEventList" class="event-list">
        <!-- Events will be rendered here -->
        <p class="dashboard-subtext">No events yet.</p>
      </div>

    </section>

    <!-- STATUS CHANGE MODAL -->
    <div id="statusModal" class="modal hidden">
      <div class="modal-content">
        <h3>Change Event Status</h3>
        <p id="currentStatusText"></p>

        <div class="status-options">
          <button class="status-option" data-status="upcoming">Upcoming</button>
          <button class="status-option" data-status="ongoing">Ongoing</button>
          <button class="status-option" data-status="completed">Completed</button>
          <button class="status-option danger" data-status="archived">Archived</button>
        </div>

        <button id="closeStatusModal" class="back-link">Cancel</button>
      </div>
    </div>

    <!-- EDIT EVENT MODAL -->
    <div id="editEventModal" class="modal hidden">
      <div class="modal-content">
        <h3>Edit Event</h3>

        <form id="editEventForm">

          <label>Event Title</label>
          <input type="text" id="editTitle" required>

          <label>Description</label>
          <textarea id="editDescription" rows="4"></textarea>

          <label>Date</label>
          <input type="date" id="editDate" required>

          <label>Time</label>
          <input type="time" id="editTime" required>

          <label>Location</label>
          <input type="text" id="editLocation" required>

          <button type="submit" class="submit-btn">
            Save Changes
          </button>

          <span id="closeEditModal" class="back-link">Cancel</span>
        </form>
      </div>
    </div>

    <!-- ARCHIVE EVENT MODAL -->
    <div id="archiveEventModal" class="modal hidden">
      <div class="modal-content">
        <h3>Archive Event</h3>
        <p>
          This event will be hidden from users.<br>
          You can still view it in the admin panel.
        </p>

        <button id="confirmArchiveBtn" class="submit-btn">
          Archive Event
        </button>

        <span id="cancelArchiveBtn" class="back-link">
          Cancel
        </span>
      </div>
    </div>

    <!-- REGISTRANTS / ATTENDANCE MODAL -->
    <div id="registrantsModal" class="modal hidden">
      <div class="modal-content registrants-content">
        <h3 id="registrantsEventTitle">Registrants</h3>

        <div id="registrantsList" class="registrants-list">
          <p class="dashboard-subtext">No registrants yet.</p>
        </div>

        <div class="form-actions">
          <button id="printRegistrantsBtn" type="button" class="submit-btn">
            Print
          </button>
          <button id="generateAllCertificatesBtn" type="button" class="submit-btn secondary">
            Generate All Certificates
          </button>
        </div>
        <span id="closeRegistrantsModal" class="back-link">Close</span>
      </div>
    </div>





    

    <!-- NAVIGATION -->
    <div class="admin-nav">
      <button type="button" class="action-card secondary"
        onclick="window.location.href='admin.html'">
        ← Back to Admin Panel
      </button>
    </div>

    <!-- LOGOUT -->
    <button id="logoutBtn" class="submit-btn logout">
      Logout
    </button>

  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>

  <!-- App Logic -->
  <script src="app.js"></script>

</body>
</html>
